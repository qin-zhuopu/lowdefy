id: execution
type: Box
properties:
  title: Console
requests:
  - id: getExecution
    type: GetExecution
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
    properties:
      executionId:
        _payload: executionId
  - id: pollLogs
    type: GetLogs
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
    properties:
      executionId:
        _payload: executionId
      afterSeq: 0
  - id: cancelExec
    type: CancelExecution
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
    properties:
      executionId:
        _payload: executionId
  - id: rerunExec
    type: RerunExecution
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
    properties:
      executionId:
        _payload: executionId
events:
  onInit:
    - id: initGetExecution
      type: Request
      params: getExecution
    - id: initGetLogs
      type: Request
      params: pollLogs
    - id: initSetLogs
      type: SetState
      params:
        logLines:
          _request: pollLogs.lines
  # Near real-time console streaming (user hard requirement).
  # Lowdefy events are linear action lists with no native loop, so the poll
  # loop is unrolled: 60 iterations of [getExecution, pollLogs, SetState, Wait 1s].
  # Each action is guarded with skip so that once the execution reaches a
  # terminal status (success/failed/cancelled) the rest of the loop no-ops.
  # The console List block is driven by the "logLines" state array; each poll
  # re-fetches the full log via pollLogs and SetState refreshes logLines, so new
  # lines appear live while the execution runs. onInit does the initial load; a
  # manual Refresh button (toolbar) re-runs the same requests as a baseline.
  onMount:
    - id: pollStatus_1
      type: Request
      params: getExecution
      skip:
        _or:
          - _eq:
              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollLogs_1
      type: Request
      params: pollLogs
      skip:
        _or:
          - _eq:
              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollSet_1
      type: SetState
      params:
        logLines:
          _request: pollLogs.lines
      skip:
        _or:
          - _eq:
              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollWait_1
      type: Wait
      params:
        ms: 1000
      skip:
        _or:
          - _eq:
              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollStatus_2
      type: Request
