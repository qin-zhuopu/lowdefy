              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollSet_2
      type: SetState
      params:
        logLines:
          _array.concat:
            - _state: logLines
            - _request: pollLogs.lines
      skip:
        _or:
