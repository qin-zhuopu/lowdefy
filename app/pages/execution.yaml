blocks:
  - id: header
    type: Title
    properties:
      content: Console output
      level: 2

  - id: statusBar
    type: Box
    layout:
      gap: 8
      justify: flex-start
    blocks:
      - id: statusTag
        type: Tag
        layout:
          flex: 0 0 auto
        properties:
          title:
            _request: getExecution.status
          color:
            _switch:
              branches:
                - if:
                    _eq:
                      - _request: getExecution.status
                      - success
                  then: success
                - if:
                    _eq:
                      - _request: getExecution.status
                      - failed
                  then: error
                - if:
                    _eq:
                      - _request: getExecution.status
                      - running
                  then: processing
                - if:
                    _eq:
                      - _request: getExecution.status
                      - queued
                  then: warning
              default: default
      - id: exitCodeTag
        type: Tag
        layout:
          flex: 0 0 auto
        properties:
          title:
            _string.concat:
              - 'exit: '
              - _if_none:
                  - _request: getExecution.exit_code
                  - '-'

  - id: toolbar
    type: Box
    layout:
      gap: 8
      justify: flex-start
    blocks:
      - id: backBtn
        type: Button
        layout:
          flex: 0 0 auto
        properties:
          title: Back
          icon: AiOutlineArrowLeft
          color: default
          variant: outlined
        events:
          onClick:
            - id: goToExecutions
              type: Link
              params:
                pageId: executions
                urlQuery:
                  jobId:
                    _request: getExecution.job_id
      - id: refreshBtn
        type: Button
        layout:
          flex: 0 0 auto
        properties:
          title: Refresh
          icon: AiOutlineReload
          color: primary
          variant: outlined
        events:
          onClick:
            - id: manualStatus
              type: Request
              params: getExecution
            - id: manualLogs
              type: Request
              params: pollLogs
            - id: manualSetLogs
              type: SetState
              params:
                logLines:
                  _request: pollLogs.lines
      - id: cancelExecBtn
        type: Button
        layout:
          flex: 0 0 auto
        properties:
          title: Cancel
          icon: AiOutlineStop
          color: danger
          variant: solid
          disabled:
            _and:
              - _ne:
                  - _request: getExecution.status
                  - running
              - _ne:
                  - _request: getExecution.status
                  - queued
        events:
          onClick:
            - id: doCancelExec
              type: Request
              params: cancelExec
            - id: refreshStatusAfterCancel
              type: Request
              params: getExecution
            - id: refreshLogsAfterCancel
              type: Request
              params: pollLogs
            - id: setLogsAfterCancel
              type: SetState
              params:
                logLines:
                  _request: pollLogs.lines
            - id: cancelExecMsg
              type: DisplayMessage
              params:
                content: Cancellation requested
                status: info
      - id: rerunExecBtn
        type: Button
        layout:
          flex: 0 0 auto
        properties:
          title: Rerun
          icon: AiOutlineRedo
          color: default
          variant: outlined
        events:
          onClick:
            - id: doRerunExec
              type: Request
              params: rerunExec
            - id: rerunExecMsg
              type: DisplayMessage
              params:
                content: Rerun queued as a new execution
                status: success

  - id: consoleCard
    type: Card
    properties:
      title: Log
      bodyStyle:
        padding: 0
    blocks:
      - id: consoleBox
        type: Box
        style:
          backgroundColor: '#1e1e1e'
          color: '#e6e6e6'
          fontFamily: monospace
          fontSize: 13px
          padding: 12px
          borderRadius: 4px
          minHeight: 240px
          maxHeight: 480px
          overflowY: auto
          whiteSpace: pre-wrap
        blocks:
          - id: logLines
            type: List
            blocks:
              - id: logLine
                type: Html
                properties:
                  html:
                    _string.concat:
                      - '<span style="color:'
                      - _switch:
                          branches:
                            - if:
                                _eq:
                                  - _state: logLines.$.stream
                                  - stderr
                              then: '#ff6b6b'
                          default: '#e6e6e6'
                      - ';white-space:pre-wrap;">'
                      - _state: logLines.$.line
                      - '</span><br/>'
          - id: emptyLog
            type: Html
            visible:
              _eq:
                - _array.length:
                    _state: logLines
                - 0
            properties:
              html: '<span style="color:#888;">(no output yet)</span>'
