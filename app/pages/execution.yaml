id: execution
type: Box
properties:
  title: Console
requests:
  - id: getExecution
    type: GetExecution
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
    properties:
      executionId:
        _payload: executionId
  # Incremental log endpoint. afterSeq is the number of log lines already held
  # in the logLines state array. Because the backend writes log seq values
  # contiguously (1, 2, 3, ...) per execution, the count of lines already
  # received equals the highest seq seen, so this feeds the GetLogs cursor and
  # only new lines are returned each poll.
  - id: pollLogs
    type: GetLogs
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
      afterSeq:
        _array.length:
          _state: logLines
    properties:
      executionId:
        _payload: executionId
      afterSeq:
        _payload: afterSeq
  # Full log reload used by the manual Refresh button (afterSeq 0).
  - id: reloadLogs
    type: GetLogs
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
      afterSeq: 0
    properties:
      executionId:
        _payload: executionId
      afterSeq: 0
  - id: cancelExec
    type: CancelExecution
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
    properties:
      executionId:
        _payload: executionId
  - id: rerunExec
    type: RerunExecution
    connectionId: runner
    payload:
      executionId:
        _url_query: executionId
    properties:
      executionId:
        _payload: executionId
events:
  onInit:
    - id: initGetExecution
      type: Request
      params: getExecution
    - id: initResetLogs
      type: SetState
      params:
        logLines: []
    - id: initGetLogs
      type: Request
      params: pollLogs
    - id: initSetLogs
      type: SetState
      params:
        logLines:
          _array.concat:
            - _state: logLines
            - _request: pollLogs.lines
  # Near real-time console streaming (user hard requirement).
  # Lowdefy events are linear action lists with no native loop and there is no
  # clean self-re-triggering event primitive, so the poll loop is UNROLLED into
  # 90 iterations of [getExecution, pollLogs(afterSeq from state), SetState
  # (APPEND new lines), Wait 1s]. Each action is guarded with skip so that once
  # the execution reaches a terminal status the rest of the loop no-ops.
  #
  # INCREMENTAL: pollLogs sends afterSeq = current logLines length, so GetLogs
  # returns only lines with seq greater than what the client already has, and
  # SetState APPENDS them (_array.concat) rather than replacing. The per-poll
  # payload is the delta, not the whole log.
  #
  # CEILING: 90 iterations at 1s ~= 90s of unattended auto-streaming.
  # Lowdefy config cannot express a self-re-arming loop, so this is a finite (if
  # generous) ceiling; after it elapses the always-available manual Refresh
  # button continues streaming from the last seq. Raising the ceiling is just a
  # matter of regenerating with a larger ITERATIONS.
  onMount:
    - id: pollStatus_1
      type: Request
      params: getExecution
      skip:
        _or:
          - _eq:
              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollLogs_1
      type: Request
      params: pollLogs
      skip:
        _or:
          - _eq:
              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollSet_1
      type: SetState
      params:
        logLines:
          _array.concat:
            - _state: logLines
            - _request: pollLogs.lines
      skip:
        _or:
          - _eq:
              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollWait_1
      type: Wait
      params:
        ms: 1000
      skip:
        _or:
          - _eq:
              - _request: getExecution.status
              - success
          - _eq:
              - _request: getExecution.status
              - failed
          - _eq:
              - _request: getExecution.status
              - cancelled
    - id: pollStatus_2
      type: Request
      params: getExecution
      skip:
        _or:
